        };

        let currentLang = 'ar';
        let currentGender = 'men';
        let tempModalLang = 'ar';
        let tempModalGender = 'men';

        function setModalLang(lang) {
            tempModalLang = lang;
            document.getElementById('modal-lang-ar').classList.toggle('selected', lang === 'ar');
            document.getElementById('modal-lang-fr').classList.toggle('selected', lang === 'fr');
            document.getElementById('modal-lang-en').classList.toggle('selected', lang === 'en');

            const t = translations[lang];
            document.getElementById('m-title').innerText = t.welcomeTitle;
            document.getElementById('m-subtitle').innerText = t.welcomeSub;
            document.getElementById('m-lang-label').innerText = t.langLabel;
            document.getElementById('m-gender-label').innerText = t.genderLabel;
            document.getElementById('m-btn-start').innerText = t.startBtn;
        }

        function setModalGender(gender) {
            tempModalGender = gender;
            document.getElementById('modal-gender-men').classList.toggle('selected', gender === 'men');
            document.getElementById('modal-gender-women').classList.toggle('selected', gender === 'women');
        }

        function startWebsite() {
            currentLang = tempModalLang;
            currentGender = tempModalGender;
            document.getElementById('welcome-modal').style.display = 'none';
            applyLanguage();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            applyLanguage();
        }

        function switchCategory(gender) {
            currentGender = gender;
            applyLanguage();
        }

        function applyLanguage() {
            const t = translations[currentLang];
            document.getElementById('html-root').setAttribute('lang', t.htmlLang);
            document.getElementById('html-root').setAttribute('dir', t.dir);

            document.getElementById('announcement-text').innerText = t.announcement;
            document.getElementById('subtext-desc').innerText = t.subtext;
            document.getElementById('tab-men').innerText = t.menTab;
            document.getElementById('tab-women').innerText = t.womenTab;

            document.getElementById('tab-men').classList.toggle('active', currentGender === 'men');
            document.getElementById('tab-women').classList.toggle('active', currentGender === 'women');
            document.getElementById('btn-lang-ar').classList.toggle('active', currentLang === 'ar');
            document.getElementById('btn-lang-fr').classList.toggle('active', currentLang === 'fr');
            document.getElementById('btn-lang-en').classList.toggle('active', currentLang === 'en');

            document.getElementById('section-heading').innerText = currentGender === 'men' ? t.menHeading : t.womenHeading;

            document.getElementById('c-modal-title').innerText = t.modalTitle;
            document.getElementById('lbl-name').innerText = t.nameLbl;
            document.getElementById('lbl-phone').innerText = t.phoneLbl;
            document.getElementById('lbl-address').innerText = t.addressLbl;
            document.getElementById('btn-confirm').innerText = t.confirmBtn;
            document.getElementById('btn-close-modal').innerText = t.cancelBtn;

            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            if (!container) return;

            const t = translations[currentLang];
            const filteredProducts = productsData.filter(p => p.category === currentGender);

            container.innerHTML = filteredProducts.map(product => `
                <div class="product-card">
                    <div class="product-image-container">
                        <img src="${product.image}" class="product-image" alt="${product.title[currentLang]}">
                    </div>
                    <div class="product-title">${product.title[currentLang]}</div>
                    <div class="product-desc">${product.desc[currentLang]}</div>
                    <div class="price-badge">${product.price}</div>
                    <div class="actions-group">
                        <button type="button" class="btn-action btn-cart" onclick="openCheckout('${product.title[currentLang]}', '${product.price}')">${t.orderBtn}</button>
                        <a href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent('Hello, I want to buy ' + product.title[currentLang])}" class="btn-action btn-wa" target="_blank">${t.waBtn}</a>
                    </div>
                </div>
            `).join('');
        }

        // خلفية Three.js
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x080a0f, 0.025);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-bg'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const frontLight = new THREE.PointLight(0xffffff, 3.5, 25);
        frontLight.position.set(2, 4, 6);
        scene.add(frontLight);

        function create3DWatch() {
            const group = new THREE.Group();
            const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.12, 32), new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.1 }));
            dial.rotation.x = Math.PI / 2;
            group.add(dial);
            group.add(new THREE.Mesh(new THREE.TorusGeometry(0.82, 0.06, 16, 32), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.95 })));
            const strap = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.06), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            const s1 = strap.clone(); s1.position.y = 1.1; group.add(s1);
            const s2 = strap.clone(); s2.position.y = -1.1; group.add(s2);
            return group;
        }

        const watches = [];
        for (let i = 0; i < 12; i++) {
            const w = create3DWatch();
            w.position.set((Math.random() - 0.5) * 14, - (i * 1.3) + 2, (Math.random() - 0.5) * 6);
            const scale = Math.random() * 0.4 + 0.6;
            w.scale.set(scale, scale, scale);
            w.userData = { rx: (Math.random() - 0.5) * 0.02, ry: (Math.random() - 0.5) * 0.02 };
            scene.add(w);
            watches.push(w);
        }

        let scrollY = 0;
        window.addEventListener('scroll', () => { scrollY = window.scrollY; });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            camera.position.y += (- (scrollY / window.innerHeight) * 4 - camera.position.y) * 0.08;
            watches.forEach(w => { w.rotation.x += w.userData.rx; w.rotation.y += w.userData.ry; });
            renderer.render(scene, camera);
        }
        animate();

        let currentProduct = "", currentPrice = "";
        function openCheckout(p, pr) {
            currentProduct = p; currentPrice = pr;
            document.getElementById('selected-product').innerText = `${p} (${pr})`;
            document.getElementById('checkout-modal').style.display = 'flex';
        }
        function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }
        function closeCheckoutOnOutside(e) { if (e.target.id === 'checkout-modal') closeCheckout(); }
        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('c-name').value;
            const phone = document.getElementById('c-phone').value;
            const address = document.getElementById('c-address').value;
            const msg = `Order: ${currentProduct} (${currentPrice})\nName: ${name}\nPhone: ${phone}\nAddress: ${address}`;
            window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
            closeCheckout();
        }

        const audio = document.getElementById('bgMusic'), musicBtn = document.getElementById('musicToggle');
        let isPlaying = false;
        musicBtn.addEventListener('click', () => {
            if (isPlaying) { audio.pause(); musicBtn.innerText = "🎵 الموسيقى: معطلة"; }
            else { audio.play().catch(()=>{}); musicBtn.innerText = "🎵 الموسيقى: شغال"; }
            isPlaying = !isPlaying;
        });

        // عرض المنتجات مباشرة عند فتح الصفحة (ليراها Google أيضًا)
        applyLanguage();
    </script>
</body>
</html>
